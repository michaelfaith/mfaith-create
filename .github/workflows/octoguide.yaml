name: OctoGuide

on:
  discussion:
    types:
      - created
      - edited
  discussion_comment:
    types:
      - created
      - deleted
      - edited
  issue_comment:
    types:
      - created
      - deleted
      - edited
  issues:
    types:
      - edited
      - opened
  pull_request_review_comment:
    types:
      - created
      - deleted
      - edited
  pull_request_target:
    types:
      - edited
      - opened

jobs:
  octoguide:
    if: ${{ !endsWith(github.actor, '[bot]') && !contains(github.event.pull_request.labels.*.name, 'autorelease') }}
    runs-on: ubuntu-latest
    permissions:
      discussions: write
      issues: write
      pull-requests: write
    steps:
      - uses: JoshuaKGoldberg/octoguide@add13d645618e42f25d8e02e2d032ef41b843e6a # 0.29.2
        with:
          config: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rules: |-
            {
              "pr-branch-non-default": false
            }
